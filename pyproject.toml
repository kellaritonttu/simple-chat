[project]
name = "chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = [
    "backend"
]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-httpx>=0.30",
    "pytest-dotenv>=0.5.2",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths    = [
    "backend",
]
pythonpath   = [
    "backend",
]
addopts      = "--tb=short -v --cov --cov-report=term-missing -p no:cacheprovider"

[tool.coverage.run]
source = [
    "backend",
]
omit   = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing  = true
skip_empty    = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]